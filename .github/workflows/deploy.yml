name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # daily rebuild so the blog post count stays current (00:00 KST)
  schedule:
    - cron: "0 15 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Vercel only redeploys on git pushes, so trigger it on the daily schedule too
  refresh-vercel:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: '[ -n "$HOOK" ] && curl -fsS -X POST "$HOOK" > /dev/null'
